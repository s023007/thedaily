<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>The Daily – Trendy Blog, News &amp; Magazine</title>

	<!-- SEO + Social sharing -->
	<meta name="description" content="The Daily – مدوّنة ومجلّة عصرية للأخبار والمقالات.">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="canonical" href="https://<YOUR-DOMAIN>/">
	<link rel="alternate" type="application/rss+xml" title="The Daily RSS Feed" href="feed.xml">

	<!-- Open Graph / Twitter Cards -->
	<meta property="og:type" content="website">
	<meta property="og:title" content="The Daily">
	<meta property="og:description" content="مدوّنة ومجلّة عصرية للأخبار والمقالات.">
	<meta property="og:url" content="https://<YOUR-DOMAIN>/">
	<meta property="og:image" content="images/logo.png">
	<meta name="twitter:card" content="summary_large_image">

	<!-- الأساس لجميع الروابط النسبية (يسهّل العمل على GitHub Pages) -->
	<base href="/">

	<!-- === CSS === -->
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/animate.css">
	<link rel="stylesheet" href="css/Pe-icon-7-stroke.css">
	<link rel="stylesheet" href="css/font-awesome.min.css">
	<link rel="stylesheet" href="css/owl.carousel.css">
	<link rel="stylesheet" href="css/owl.theme.css">
	<link rel="stylesheet" href="css/meanmenu.css">
	<link rel="stylesheet" href="css/highlight.css">
	<link rel="stylesheet" href="css/font.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/responsive.css">
</head>

<body>
	<!-- ------------- محتوى الموقع (كما هو عندك) ------------- -->
	<!-- ………… ضع هنا كل الـ HTML الخاص بك من القوائم، السلايدر، المقالات ………… -->
	<!-- قمتُ بقصّه لتوفير المساحة. انسخه كما هو من نسختك الحالية لأنه لم يحتج تغييرات مسارات. -->

	<!-- === JavaScript === -->
	<!-- jQuery من CDN لأن الملف غير موجود محليًا -->
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
		integrity="sha384-55mE16BbSbBQLJq8B1X2A4Q48BwcVLi1Gx5ZJ5Tq2lhS8uAnhw2y0G0gLkP0XEy5"
		crossorigin="anonymous"></script>

	<script src="js/bootstrap.min.js"></script>
	<script src="js/owl.carousel.min.js"></script>
	<script src="js/wow.min.js"></script>
	<script src="js/jquery.meanmenu.min.js"></script>
	<script src="js/jquery.jscroll.js"></script>
	<script src="js/scripts.js"></script>

	<script>
		/* إعدادات المكوّنات بعد تحميل الصفحة */
		jQuery(function ($) {

			/* تفعيل القائمة المتجاوبة */
			$('.category-nav').meanmenu();

			/* سلايدر الأخبار الرئيسى */
			$('#slider').owlCarousel({
				items: 1,
				slideSpeed: 300,
				paginationSpeed: 400,
				singleItem: true,
				autoPlay: true,
				stopOnHover: true
			});

			/* سلايدر التريند */
			$('#trend-post').owlCarousel({
				items: 5,
				slideSpeed: 300,
				paginationSpeed: 400,
				autoPlay: true,
				stopOnHover: true,
				responsive: true,
				responsiveRefreshRate: 200,
				responsiveBaseWidth: window
			});

			/* WOW.js للأنيميشن */
			new WOW().init();
		});
	</script>
</body>
</html>
